name: Terraform Production

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the planned infrastructure changes'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: infrastructure/terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_RESOURCE_GROUP_NAME: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
          ARM_STORAGE_ACCOUNT_NAME: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
          ARM_CONTAINER_NAME: tfstate
          ARM_KEY: pgcb-prod.tfstate
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_mfa_encryption_key: ${{ secrets.MFA_ENCRYPTION_KEY }}
          TF_VAR_metrics_token: ${{ secrets.METRICS_TOKEN }}
          TF_VAR_container_web_image: ${{ secrets.CONTAINER_WEB_IMAGE }}
          TF_VAR_container_api_image: ${{ secrets.CONTAINER_API_IMAGE }}
          TF_VAR_container_worker_image: ${{ secrets.CONTAINER_WORKER_IMAGE }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
