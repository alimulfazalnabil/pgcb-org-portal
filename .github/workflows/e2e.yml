name: End-to-End

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop, phase-2-upgrade]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pgcb_test
          POSTGRES_PASSWORD: pgcb_test_pass
          POSTGRES_DB: pgcb_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install API dependencies
        working-directory: services/api
        run: pip install -r requirements.txt

      - name: Start API
        working-directory: services/api
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://pgcb_test:pgcb_test_pass@127.0.0.1:5432/pgcb_test_db
          JWT_SECRET: e2e-test-secret-change-me-32-characters-minimum
          FRONTEND_URL: http://127.0.0.1:3000
          REQUIRE_EMAIL_VERIFICATION: 'false'
          RATE_LIMIT_ENABLED: 'false'
        run: |
          alembic upgrade head
          python -m app.db.seed
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/pgcb-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ready && break; sleep 2; done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build and Run Next.js
        working-directory: apps/web
        env:
          INTERNAL_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_BASE_PATH: /backend
        run: |
          npm run build
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/pgcb-web.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000 >/dev/null && break; sleep 2; done

      - name: Run Playwright
        working-directory: apps/web
        env:
          CI: 'true'
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          BASE_URL: http://127.0.0.1:3000
        run: npm run e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
