name: End-to-End

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install API dependencies
        working-directory: services/api
        run: pip install -r requirements.txt

      - name: Start API
        working-directory: services/api
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./e2e.db
          JWT_SECRET: e2e-test-secret-change-me-32-characters-minimum
          FRONTEND_URL: http://127.0.0.1:3000
          REQUIRE_EMAIL_VERIFICATION: 'false'
          RATE_LIMIT_ENABLED: 'false'
        run: |
          python -m app.db.seed
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/pgcb-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ready && break; sleep 2; done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Next.js
        working-directory: apps/web
        env:
          INTERNAL_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_BASE_PATH: /backend
        run: |
          nohup npm run dev >/tmp/pgcb-web.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000 >/dev/null && break; sleep 2; done

      - name: Run Playwright
        working-directory: apps/web
        env:
          CI: 'true'
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          BASE_URL: http://127.0.0.1:3000
        run: npm run e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
