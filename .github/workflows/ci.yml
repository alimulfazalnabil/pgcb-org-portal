name: PGCB Portal CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/api/requirements.txt'

      - name: Install Backend Dependencies
        working-directory: ./services/api
        run: pip install -r requirements.txt pytest

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Lint & Typecheck Frontend
        working-directory: ./apps/web
        run: npm run lint

      - name: Run Backend Tests
        working-directory: ./services/api
        env:
          APP_ENV: test
          JWT_SECRET: "test-secret-32-characters-minimum-for-ci"
          DATABASE_URL: "sqlite:///./test.db"
        run: pytest

      - name: Build Frontend
        working-directory: ./apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"

      - name: Start Background API for E2E
        working-directory: ./services/api
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./e2e.db
          JWT_SECRET: "e2e-test-secret-change-me-32-characters-minimum"
          FRONTEND_URL: "http://127.0.0.1:3000"
          REQUIRE_EMAIL_VERIFICATION: "false"
          RATE_LIMIT_ENABLED: "false"
        run: |
          python -m app.db.seed
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/pgcb-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done || (cat /tmp/pgcb-api.log && exit 1)

      - name: Install Playwright Browsers
        working-directory: ./apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: ./apps/web
        env:
          CI: "true"
          INTERNAL_API_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
        run: npx playwright test

  deploy-to-render:
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render Deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ env.RENDER_DEPLOY_HOOK_URL }}
          method: 'POST'
          customHeaders: '{"Accept": "application/json"}'

      - name: Skip Render deployment when deploy hook is not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping Render deployment."

