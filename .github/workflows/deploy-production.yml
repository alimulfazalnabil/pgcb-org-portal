name: Deploy Production

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-pgcb-portal
  ACR_NAME: acrpgcbportal
  API_APP: api-pgcb-portal
  WEB_APP: web-pgcb-portal
  WORKER_APP: worker-pgcb-portal
  ACR_LOGIN_SERVER: acrpgcbportal.azurecr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build API image in ACR
        run: az acr build --registry "$ACR_NAME" --image "pgcb-api:${GITHUB_SHA}" --image "pgcb-api:production" services/api

      - name: Build web image in ACR
        run: az acr build --registry "$ACR_NAME" --image "pgcb-web:${GITHUB_SHA}" --image "pgcb-web:production" apps/web

      - name: Deploy API
        run: az containerapp update --name "$API_APP" --resource-group "$AZURE_RESOURCE_GROUP" --image "$ACR_LOGIN_SERVER/pgcb-api:${GITHUB_SHA}"

      - name: Deploy worker
        run: az containerapp update --name "$WORKER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --image "$ACR_LOGIN_SERVER/pgcb-api:${GITHUB_SHA}"

      - name: Deploy web
        run: az containerapp update --name "$WEB_APP" --resource-group "$AZURE_RESOURCE_GROUP" --image "$ACR_LOGIN_SERVER/pgcb-web:${GITHUB_SHA}"

      - name: Smoke test edge endpoint
        run: |
          URL=$(az containerapp show --name "$WEB_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors "https://${URL}/"
