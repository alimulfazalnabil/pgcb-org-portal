services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pgcb_portal}
      POSTGRES_USER: ${POSTGRES_USER:-pgcb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgcb_dev_password}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgcb} -d ${POSTGRES_DB:-pgcb_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: {context: ./services/api}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pgcb}:${POSTGRES_PASSWORD:-pgcb_dev_password}@postgres:5432/${POSTGRES_DB:-pgcb_portal}
      JWT_SECRET: ${JWT_SECRET:-replace-this-in-real-environments}
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_ROOT: ${STORAGE_ROOT:-./storage}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      BKASH_WEBHOOK_SECRET: ${BKASH_WEBHOOK_SECRET:-}
      NAGAD_WEBHOOK_SECRET: ${NAGAD_WEBHOOK_SECRET:-}
      SSLCOMMERZ_WEBHOOK_SECRET: ${SSLCOMMERZ_WEBHOOK_SECRET:-}
      BKASH_CHECKOUT_URL: ${BKASH_CHECKOUT_URL:-}
      NAGAD_CHECKOUT_URL: ${NAGAD_CHECKOUT_URL:-}
      SSLCOMMERZ_CHECKOUT_URL: ${SSLCOMMERZ_CHECKOUT_URL:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports: ["8000:8000"]
  worker:
    build: {context: ./services/api}
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pgcb}:${POSTGRES_PASSWORD:-pgcb_dev_password}@postgres:5432/${POSTGRES_DB:-pgcb_portal}
      JWT_SECRET: ${JWT_SECRET:-replace-this-in-real-environments}
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_ROOT: ${STORAGE_ROOT:-./storage}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-}
      SMS_PROVIDER_NAME: ${SMS_PROVIDER_NAME:-}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-30}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      BKASH_WEBHOOK_SECRET: ${BKASH_WEBHOOK_SECRET:-}
      NAGAD_WEBHOOK_SECRET: ${NAGAD_WEBHOOK_SECRET:-}
      SSLCOMMERZ_WEBHOOK_SECRET: ${SSLCOMMERZ_WEBHOOK_SECRET:-}
      BKASH_CHECKOUT_URL: ${BKASH_CHECKOUT_URL:-}
      NAGAD_CHECKOUT_URL: ${NAGAD_CHECKOUT_URL:-}
      SSLCOMMERZ_CHECKOUT_URL: ${SSLCOMMERZ_CHECKOUT_URL:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build: {context: ./apps/web}
    environment:
      NEXT_PUBLIC_API_BASE_PATH: /backend
      INTERNAL_API_URL: http://api:8000
    depends_on: [api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports: ["3000:3000"]
volumes:
  postgres_data: {}
  redis_data: {}
