services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pgcb_portal}
      POSTGRES_USER: ${POSTGRES_USER:-pgcb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgcb_dev_password}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgcb} -d ${POSTGRES_DB:-pgcb_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: {context: ./services/api}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pgcb}:${POSTGRES_PASSWORD:-pgcb_dev_password}@postgres:5432/${POSTGRES_DB:-pgcb_portal}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      JWT_SECRET: ${JWT_SECRET:-replace-this-in-real-environments-minimum-32-chars}
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REDIS_RATE_LIMIT_ENABLED: "false"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/uploads}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      BKASH_WEBHOOK_SECRET: ${BKASH_WEBHOOK_SECRET:-}
      NAGAD_WEBHOOK_SECRET: ${NAGAD_WEBHOOK_SECRET:-}
      SSLCOMMERZ_WEBHOOK_SECRET: ${SSLCOMMERZ_WEBHOOK_SECRET:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - uploads_data:/data/uploads
      - backups_data:/data/backups
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports: ["8000:8000"]

  web:
    build: {context: ./apps/web}
    environment:
      NEXT_PUBLIC_API_BASE_PATH: /backend
      INTERNAL_API_URL: http://api:8000
    depends_on: [api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports: ["3000:3000"]

volumes:
  postgres_data: {}
  uploads_data: {}
  backups_data: {}
