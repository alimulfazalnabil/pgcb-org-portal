# Render Blueprint for PGCB Diploma Engineers Organization Portal (Diprokous)
# Supports 1-click staging/production deployment on Render.com alongside Docker / HostSeba VPS.

databases:
  - name: pgcb-portal-db
    databaseName: pgcb_portal
    user: pgcb_portal_user
    plan: basic-256mb
    ipAllowList: []

services:
  - type: web
    name: pgcb-portal-api
    runtime: python
    rootDir: services/api
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head && python -m app.db.seed --production --import-official-members
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: pgcb-portal-uploads
      mountPath: /var/data/uploads
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pgcb-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: persistent_disk
      - key: STORAGE_ROOT
        value: /var/data/uploads
      - key: PAYMENT_MODE
        value: sandbox
      - key: FRONTEND_URL
        value: https://pgcb-portal-web.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://pgcb-portal-web.onrender.com

  - type: web
    name: pgcb-portal-web
    runtime: node
    rootDir: apps/web
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://pgcb-portal-api.onrender.com
