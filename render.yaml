version: "1"

services:
  # 1. Next.js Frontend (Web Service)
  - type: web
    name: pgcb-portal-web
    runtime: node
    rootDir: apps/web
    region: singapore
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: pgcb-portal-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: pgcb-portal-api
          envVarKey: RENDER_EXTERNAL_URL
    healthCheckPath: /api/health

  # 2. FastAPI Backend (Web Service)
  - type: web
    name: pgcb-portal-api
    runtime: python
    rootDir: services/api
    region: singapore
    plan: starter
    preDeployCommand: python scripts/verify_production_contract.py && alembic upgrade head
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: pgcb-portal-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: pgcb-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pgcb-redis
          property: connectionString
      - fromGroup: shared-secrets
    healthCheckPath: /ready

  # 3. Background Worker (Celery)
  - type: worker
    name: pgcb-portal-worker
    runtime: python
    rootDir: services/api
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker.celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pgcb-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pgcb-redis
          property: connectionString
      - fromGroup: shared-secrets

  # 4. Scheduled Tasks (Cron)
  - type: cron
    name: pgcb-daily-tasks
    runtime: python
    rootDir: services/api
    region: singapore
    schedule: "0 18 * * *" # 18:00 UTC = 00:00 BST (Bangladesh Standard Time, UTC+6)
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.daily
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pgcb-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pgcb-redis
          property: connectionString
      - fromGroup: shared-secrets

  # 5. Redis Key-Value Store
  - type: keyvalue
    name: pgcb-redis
    region: singapore
    plan: starter
    ipAllowList: []

databases:
  # 6. PostgreSQL Database
  - name: pgcb-postgres
    region: singapore
    plan: starter
    databaseName: pgcb_db
    user: pgcb_admin

envVarGroups:
  - name: shared-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: azure
      - key: AZURE_STORAGE_CONTAINER
        value: pgcb-files
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false
      - key: AZURE_STORAGE_ACCOUNT_URL
        sync: false
